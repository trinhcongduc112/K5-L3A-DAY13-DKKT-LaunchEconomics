#
# ── D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) ──
#   a) Chia theo yêu cầu, co_mau(0.70, 0.75) ............................ ?  ← bước 21
#   b) Theo nhân viên, m = 75: DE = 1 + 74×0,02 = 2,48
#      n = n(a) × DE; số nhân viên mỗi nhóm = ceil(n / 75) .............. ?  ← bước 21
#      (đối chiếu với 40 nhân viên của LogiX-VN: đủ hay không đủ)
#   c) 20 nhân viên mỗi nhóm: trần hiệu dụng = c/ICC = 20/0,02
#      so với con số ở câu a ........................................... ?  ← bước 21
#   d) 6 depot mỗi nhóm: trần hiệu dụng = 6/0,02 ....................... ?  ← bước 21
#   e) Mức chênh 6 điểm = 859/nhóm, 20 người/nhóm: giải 20m / (1 + (m−1)×0,02) ≥ 859 → m
#      ................................................................ ?  ← bước 21
#   → Chỉ chọn cách chia ở bước 22, sau khi có đủ năm số trên. Không chọn theo cảm tính.
#
# ── D2 · Năm câu "tách được tác động" — nháp trước, câu 5 chốt theo cách chia ở bước 22 ──
#   1. Đối chứng cùng thời gian: 20 nhân viên đối chứng làm đúng cùng tuần, cùng depot với nhóm dùng trợ lý.
#   2. Ngẫu nhiên: bốc thăm bằng code, seed ghi vào biên bản TRƯỚC khi chạy, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp: rủi ro nhân viên đối chứng hỏi lại / chép câu trả lời của nhóm dùng trợ lý
#      trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Viết trước: chỉ số chính, ngưỡng dừng và ngày quyết định chốt trước ngày chạy bước 0,10.
#   5. Ít nhất 20 cụm mỗi nhóm: ? ← phụ thuộc cách chia, trả lời ở bước 22.
#
# Đánh đổi đã chấp nhận: ?          ← bước 22 (ghi rõ nếu cách chia chưa đạt cả hai điều kiện)
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: ?   ← bước 21 tính tỉ lệ, bước 22 đặt ngưỡng
#
# ── Luật dừng: nháp đủ bốn vế NẾU – TRONG – THÌ – KHÔNG THÌ, chờ ngưỡng số ở bước 21/22 ──
#   an toàn : NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ ? điểm
#             TRONG ? tuần liên tiếp THÌ ? (ai tắt, mất bao lâu) KHÔNG THÌ ?
#   chi phí : NẾU chi phí mỗi việc thành công > ? đ TRONG ? tuần liên tiếp THÌ ? KHÔNG THÌ ?
#   sử dụng : NẾU tỉ lệ bỏ qua gợi ý > ? % TRONG ? tuần THÌ ? KHÔNG THÌ ?
#   → Ngưỡng an toàn phải đặt SO VỚI NHÓM ĐỐI CHỨNG và có trần tuyệt đối CAO HƠN tỉ lệ mở lại
#     hiện tại của dữ liệu; nếu không pilot sẽ bị chính luật của mình dừng ngay tuần đầu.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"   # chức danh có quyền quyết định, không ghi tên bạn trong nhóm, không ghi "cả đội"
