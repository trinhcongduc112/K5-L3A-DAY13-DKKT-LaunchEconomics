    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.05                           # nếu phải nâng lên 6 điểm thì sửa ở bước 22 và ghi vào đánh đổi
    alpha: 0.05
    power: 0.80
    n_per_arm: "?"                      # bước 21
    design_effect: "?"                  # 1 nếu chia theo yêu cầu; 1 + (m−1)×0,02 nếu chia theo cụm
    clusters_per_arm: "?"               # để trống nếu chia theo yêu cầu
  identifiability:
    concurrent_control: "?"             # D2 câu 1
    spillover_risk: "?"                 # D2 câu 3
    predeclared: "?"                    # D2 câu 4
  stop_rules:
    - "NẾU ? TRONG ? THÌ ? KHÔNG THÌ ?"
    - "NẾU ? TRONG ? THÌ ? KHÔNG THÌ ?"
    - "NẾU ? TRONG ? THÌ ? KHÔNG THÌ ?"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt khẩn cấp trên bảng điều khiển trợ lý; hiệu lực trong 30 phút; trong 30 phút đó khách được phục vụ bằng luồng nhân viên tự làm (6 phút/yêu cầu), không chờ trợ lý bật lại"
  decision_date: "2027-01-05"           # bắt đầu 07/12/2026 (T2), 3 tuần rollout tới 28/12/2026, đo thêm 1 tuần
