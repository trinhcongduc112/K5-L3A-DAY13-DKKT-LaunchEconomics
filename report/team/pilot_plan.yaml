    - "Giá giả định của lab: token vào 26 đ / ra 130 đ mỗi 1.000 token, tool 15 đ mỗi lần, lương nhân viên 2.000 đ/phút, nhân viên tự làm 12.000 đ/yêu cầu, chi phí cố định 40 triệu đ/tháng"
